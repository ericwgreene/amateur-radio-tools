<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{% block title %}Amateur Radio Tools{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>"
    />
    <script src="/static/js/htmx.min.js" defer></script>
  </head>
  <body class="flex min-h-full flex-col bg-slate-950 text-slate-100 antialiased">
    {% include "partials/_nav.html" %}
    <main class="mx-auto w-full max-w-4xl flex-1 px-4 py-8">
      {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-slate-800 bg-slate-900">
      <div class="mx-auto w-full max-w-4xl px-4 py-6 text-sm text-slate-400">
        Amateur Radio Tools — built with Rust, Actix&nbsp;Web, Askama &amp; HTMX.
      </div>
    </footer>
  </body>
</html>
