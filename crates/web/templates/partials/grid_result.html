{% if let Some(err) = error %}
<div
  class="rounded-md bg-rose-50 px-4 py-3 text-sm text-rose-700 ring-1 ring-inset ring-rose-200"
  role="alert"
>
  {{ err }}
</div>
{% else %}{% if let Some(loc) = locator %}
<div
  class="rounded-md bg-emerald-50 px-4 py-4 ring-1 ring-inset ring-emerald-200"
>
  <div class="text-sm text-emerald-700">
    Grid locator for {{ lat }}, {{ lon }}
  </div>
  <div
    class="mt-1 font-mono text-3xl font-bold tracking-widest text-emerald-900"
  >
    {{ loc }}
  </div>
</div>
{% endif %}{% endif %}
