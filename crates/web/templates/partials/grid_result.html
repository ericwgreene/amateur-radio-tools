{% if let Some(err) = error %}
<div
  class="rounded-md bg-rose-500/10 px-4 py-3 text-sm text-rose-300 ring-1 ring-inset ring-rose-500/30"
  role="alert"
>
  {{ err }}
</div>
{% else %}{% if let Some(loc) = locator %}
<div
  class="rounded-md bg-emerald-500/10 px-4 py-4 ring-1 ring-inset ring-emerald-500/30"
>
  <div class="text-sm text-emerald-300">
    Grid locator for {{ lat }}, {{ lon }}
  </div>
  <div
    class="mt-1 font-mono text-3xl font-bold tracking-widest text-emerald-200"
  >
    {{ loc }}
  </div>
</div>
{% endif %}{% endif %}
