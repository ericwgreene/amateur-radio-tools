{% if let Some(err) = error %}
<span class="text-sm text-rose-400">{{ err }}</span>
{% else %}{% if let Some(country) = country %}
<span class="inline-flex items-center gap-1.5 text-sm text-slate-300">
  <span aria-hidden="true">🌍</span>
  <span class="font-mono font-semibold text-slate-100">{{ callsign }}</span>
  <span class="text-slate-500">→</span>
  <span class="font-medium">{{ country }}</span>
  {% if let Some(cont) = continent %}<span class="text-slate-500">({{ cont }})</span>{% endif %}
</span>
{% endif %}{% endif %}
