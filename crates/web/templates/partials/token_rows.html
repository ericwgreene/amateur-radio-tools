{% if tokens.is_empty() %}
<p class="py-4 text-sm text-slate-500">No API tokens yet.</p>
{% else %}
<ul class="divide-y divide-slate-800">
  {% for t in tokens %}
  <li class="flex items-center justify-between gap-4 py-3">
    <div>
      <div class="font-medium text-slate-100">
        {{ t.name }} {% if t.revoked %}<span
          class="ml-1 rounded bg-slate-800 px-1.5 py-0.5 text-xs font-normal text-slate-400"
          >revoked</span
        >{% endif %}
      </div>
      <div class="mt-0.5 font-mono text-xs text-slate-400">{{ t.prefix }}…</div>
      <div class="mt-0.5 text-xs text-slate-500">
        created {{ t.created_at }} · last used {{ t.last_used }}
      </div>
    </div>
    {% if !t.revoked %}
    <button
      type="button"
      class="shrink-0 rounded-md bg-slate-800 px-3 py-1.5 text-sm font-medium text-slate-200 hover:bg-rose-500/20 hover:text-rose-300"
      hx-post="/settings/tokens/{{ t.id }}/revoke"
      hx-target="#tokens-list"
      hx-swap="innerHTML"
      hx-confirm="Revoke “{{ t.name }}”? Applications using it will stop working."
    >
      Revoke
    </button>
    {% endif %}
  </li>
  {% endfor %}
</ul>
{% endif %}
