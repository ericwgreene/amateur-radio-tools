<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ status }} — Amateur Radio Tools</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body class="flex min-h-full items-center bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-md px-4 py-24 text-center">
      <div class="text-6xl font-bold text-slate-300">{{ status }}</div>
      <h1 class="mt-4 text-xl font-semibold text-slate-900">{{ title }}</h1>
      <p class="mt-2 text-slate-600">{{ message }}</p>
      <div class="mt-6 flex justify-center gap-3">
        <a
          href="/"
          class="rounded-md bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-500"
          >Back home</a
        >
        {% if status == 401 %}
        <a
          href="/login"
          class="rounded-md bg-slate-100 px-4 py-2 font-medium text-slate-700 hover:bg-slate-200"
          >Log in</a
        >
        {% endif %}
      </div>
    </main>
  </body>
</html>
