[workspace]
resolver = "3"
members = ["crates/entity", "crates/migration", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ericwgreene/amateur-radio-tools"

# Centralized dependency versions shared across all workspace crates.
# Versions here were resolved against Rust 1.94 and validated to compile together.
[workspace.dependencies]
# --- Web framework ---
actix-web = "4"
actix-session = { version = "0.11", features = ["cookie-session"] }
actix-files = "0.6"

# --- Templating (server-side) ---
# askama 0.16 is the modern release (the old `askama_actix` crate is superseded by
# `askama_web`, which provides the actix-web Responder integration).
askama = "0.16"
askama_web = { version = "0.16", features = ["actix-web-4"] }

# --- Database / ORM ---
# SeaORM is backend-agnostic: swapping SQLite for PostgreSQL is a matter of enabling
# the `sqlx-postgres` feature and changing DATABASE_URL. See README.
sea-orm = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

# --- Auth0 / OpenID Connect ---
# openidconnect 4 pins reqwest 0.12; we use the same version so the HTTP client types
# line up between our code and the OIDC library.
openidconnect = { version = "4", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Async runtime ---
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# --- Utilities ---
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
